<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Poem & Song Zone — Eduverse English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#ffe9c7; --bg-2:#ffe0ec; --bg-3:#fff3e0;
    --ink:#2b2b3d; --card:#fffaf2;
    --brand:#f2803f; --brand-dark:#b85c26;
    --good:#06d6a0; --good-dark:#039e77;
    --gentle:#ffb84d; --gentle-dark:#c97a1e;
    --radius:22px;
    --shadow:0 8px 0 rgba(0,0,0,.10);
    --font-display:'Baloo 2',cursive; --font-body:'Nunito',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--font-body);
    background:linear-gradient(160deg,var(--bg-1),var(--bg-3) 55%,var(--bg-2));
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    min-height:100%;
    padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
    overflow-x:hidden;
  }
  .screen{ width:100%; max-width:520px; display:flex; flex-direction:column; align-items:center; flex:1; padding:16px 0 32px; }
  .hidden{ display:none !important; }

  /* No linear progress/score bar here on purpose — this zone is
     explicitly ungated (see module-07-puisi-lagu.json designNote
     and world-of-stories-asset-brief.md point 1). A soft dot row
     instead of a filling gauge avoids the "scored" visual language
     used by every other module. */
  .topbar{ width:100%; max-width:520px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 4px; }
  .icon-btn{
    border:none; background:var(--card); box-shadow:var(--shadow); border-radius:16px;
    width:44px; height:44px; font-size:20px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:0 0 auto;
  }
  .icon-btn:active{ transform:translateY(4px); box-shadow:none; }
  .song-dots{ display:flex; gap:6px; flex:1; justify-content:center; flex-wrap:wrap; }
  .song-dot{ width:10px; height:10px; border-radius:50%; background:#ffffffaa; }
  .song-dot.visited{ background:var(--brand); }

  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:28px 22px; width:100%; text-align:center;
  }
  .title-en{ font-family:var(--font-display); font-size:2rem; font-weight:700; margin:0; color:var(--brand-dark); }
  .title-bm{ font-size:1.1rem; color:#8a7360; margin:4px 0 18px; font-weight:600; }
  .instructions{ font-size:1.05rem; line-height:1.5; background:#fff3e0; border-radius:14px; padding:14px 16px; margin-bottom:22px; }
  .big-btn{
    border:none; cursor:pointer; font-weight:800; font-size:1.15rem;
    color:#fff; background:var(--brand); box-shadow:0 6px 0 var(--brand-dark);
    padding:16px 28px; border-radius:18px; width:100%; max-width:320px;
  }
  .big-btn:active{ transform:translateY(6px); box-shadow:none; }
  .big-btn.secondary{ background:var(--good); box-shadow:0 6px 0 var(--good-dark); margin-top:14px; }

  .stage{ width:100%; display:flex; flex-direction:column; align-items:center; gap:16px; margin-top:4px;}
  .scene{
    width:100%; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:24px 20px; display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .song-title{ font-family:var(--font-display); font-size:1.3rem; font-weight:700; color:var(--brand-dark); }
  .verse-text{ font-size:1.15rem; line-height:1.8; color:#4a3a2c; font-style:italic; white-space:pre-line; text-align:center; }
  .speaker-btn{
    border:none; cursor:pointer; border-radius:999px; width:70px; height:70px; font-size:2rem;
    background:var(--brand); color:#fff; box-shadow:0 6px 0 var(--brand-dark);
    display:flex; align-items:center; justify-content:center;
  }
  .speaker-btn:active{ transform:translateY(6px); box-shadow:none; }
  .speaker-btn.playing{ animation:pulse .5s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }

  .rhyme-line{ font-size:1.15rem; font-weight:700; color:#4a3a2c; text-align:center; }
  .rhyme-blank{ display:inline-block; min-width:70px; border-bottom:3px dashed var(--brand); padding:0 6px; color:var(--good-dark); font-weight:800; }

  .prompt-text{ font-weight:700; color:#8a7360; font-size:.9rem; text-align:center; }

  .answers{ width:100%; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .answer-btn{
    border:none; cursor:pointer; font-weight:800; font-size:1.05rem;
    padding:16px 4px; border-radius:16px; background:#fff3e0; color:var(--brand-dark);
    box-shadow:0 5px 0 #f0dcc0;
  }
  .answer-btn:active{ transform:translateY(5px); box-shadow:none; }
  .answer-btn.found-correct{ background:var(--good); color:#fff; box-shadow:0 5px 0 var(--good-dark); animation:bounce .5s ease; }
  .answer-btn.try-again{ background:var(--gentle); color:#fff; box-shadow:0 5px 0 var(--gentle-dark); animation:wobble .4s ease; }
  .answer-btn.solved-disabled{ opacity:.5; pointer-events:none; }
  @keyframes bounce{ 0%{transform:scale(1);} 40%{transform:scale(1.12);} 100%{transform:scale(1);} }
  @keyframes wobble{ 0%,100%{transform:rotate(0);} 30%{transform:rotate(-4deg);} 70%{transform:rotate(4deg);} }

  .feedback-banner{ width:100%; text-align:center; font-weight:800; font-size:1.05rem; min-height:1.5rem; color:var(--brand-dark); }

  .next-btn{
    border:none; cursor:pointer; font-weight:800; font-size:1.05rem;
    color:#fff; background:var(--good); box-shadow:0 6px 0 var(--good-dark);
    padding:14px 26px; border-radius:18px; width:100%; max-width:280px;
  }
  .next-btn:active{ transform:translateY(6px); box-shadow:none; }
  .next-btn.invite{ animation:pulse .8s ease-in-out infinite; }

  .celebrate-emoji{ font-size:3rem; margin:6px 0; }
  .result-msg{ font-size:1.3rem; font-weight:800; margin-bottom:6px; color:var(--brand-dark); }
  .result-sub{ color:#8a7360; margin-bottom:24px; font-size:.95rem; }
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" id="backBtn" aria-label="Back" title="Back">←</button>
  <div class="song-dots" id="songDots"></div>
  <button class="icon-btn" id="muteBtn" aria-label="Toggle sound" title="Toggle sound">🔊</button>
</div>

<!-- START SCREEN -->
<section id="startScreen" class="screen">
  <div class="card">
    <p class="title-en" id="titleEn">Poem &amp; Song Zone</p>
    <p class="title-bm" id="titleBm">Zon Puisi &amp; Lagu</p>
    <p class="instructions" id="instructionsText">Listen to the song. Tap the word that rhymes.</p>
    <button class="big-btn" id="startBtn">🎵 Start Exploring</button>
  </div>
</section>

<!-- GAME SCREEN -->
<section id="gameScreen" class="screen hidden">
  <div class="stage">
    <div class="scene">
      <div class="song-title" id="songTitle">Kancil's Hop</div>
      <div class="verse-text" id="verseText"></div>
      <button class="speaker-btn" id="speakerBtn" aria-label="Play song">🔊</button>
      <div class="prompt-text">Tap the speaker to listen, then find the rhyme.</div>
      <div class="rhyme-line" id="rhymeLine"></div>
    </div>

    <div class="answers" id="answers"></div>

    <div class="feedback-banner" id="feedbackBanner"></div>

    <button class="next-btn" id="nextBtn">Next Song ▶</button>
  </div>
</section>

<!-- RESULTS SCREEN (no stars/grade — pure celebration of exploring) -->
<section id="resultsScreen" class="screen hidden">
  <div class="card">
    <div class="celebrate-emoji">🎉🎶</div>
    <div class="result-msg" id="resultMsg">You explored every song!</div>
    <div class="result-sub">Come back anytime to sing and rhyme again.</div>
    <button class="big-btn secondary" id="playAgainBtn">🔁 Explore Again</button>
    <button class="big-btn" id="doneBtn" style="margin-top:12px;background:#8a8aa3;box-shadow:0 6px 0 #6d6d85;">✓ Done</button>
  </div>
</section>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

  /* ============================================================
     Firebase config — same object duplicated in login.html, hub.html
     and every modules/*.html file (each screen is a self-contained
     page with no shared JS import). The API key is a public client
     identifier; access is controlled by Firestore security rules.
     ============================================================ */
  const firebaseConfig = {
    apiKey: "AIzaSyBtlViRgm26PuMPvNC9GoKA9hBwtYT-HEg",
    authDomain: "english-dbcda.firebaseapp.com",
    projectId: "english-dbcda",
    storageBucket: "english-dbcda.firebasestorage.app",
    messagingSenderId: "174382751098",
    appId: "1:174382751098:web:7736264ea3153970cd8ac3"
  };
  const firebaseApp = initializeApp(firebaseConfig);
  const db = getFirestore(firebaseApp);

  /* ============================================================
     CONFIG
     ============================================================ */
  const CONTENT_URL = "../content/year1/module-07-puisi-lagu.json";
  const STUDENT_ID_KEY = "eduverse_student_id"; // set by login.html

  /* ============================================================
     AUDIO ENGINE — no harsh "wrong" buzzer anywhere in this module;
     "try again" gets a soft, encouraging tone, never the sawtooth
     error sound other modules use. Matches the "without
     penalization" requirement in the content JSON's designNote.
     ============================================================ */
  const AudioEngine = (function(){
    let muted = false;
    let ctx = null;
    function getCtx(){
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctx = new AC();
      }
      return ctx;
    }
    function tone(freq, duration, type){
      if (muted) return;
      const c = getCtx();
      if (!c) return;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.22, c.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + duration);
      osc.connect(gain).connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + duration + 0.02);
    }
    function speakVerseFallback(text, onend){
      if (muted) { if (onend) onend(); return; }
      if (!("speechSynthesis" in window)) {
        tone(440, 0.18, "sine"); setTimeout(() => tone(523, 0.25, "sine"), 250);
        if (onend) setTimeout(onend, 600);
        return;
      }
      window.speechSynthesis.cancel();
      const lines = text.split("\n").filter(Boolean);
      let i = 0;
      function speakNext(){
        if (i >= lines.length) { if (onend) onend(); return; }
        const u = new SpeechSynthesisUtterance(lines[i]);
        u.lang = "en-GB";
        u.rate = 0.75;
        u.pitch = 1.1;
        u.onend = () => { i++; setTimeout(speakNext, 300); };
        window.speechSynthesis.speak(u);
      }
      speakNext();
    }
    let currentAudioEl = null;
    function speakVerse(item, onend){
      if (muted) { if (onend) onend(); return; }
      if (currentAudioEl) { currentAudioEl.pause(); currentAudioEl = null; }
      const audio = new Audio(`../assets/audio/year1/module-07-puisi-lagu/${item.id}.mp3`);
      currentAudioEl = audio;
      audio.addEventListener("ended", () => { if (onend) onend(); });
      audio.addEventListener("error", () => { speakVerseFallback(item.verseText.en, onend); });
      audio.play().catch(() => { speakVerseFallback(item.verseText.en, onend); });
    }
    return {
      speakVerse,
      playFoundRhyme(){ tone(660, 0.15, "sine"); setTimeout(() => tone(880, 0.22, "sine"), 130); },
      playTryAgain(){ tone(420, 0.18, "sine"); },
      playAllExplored(){ [523,659,784,1047].forEach((f,idx)=>setTimeout(()=>tone(f,0.22,"sine"), idx*140)); },
      setMuted(v){
        muted = v;
        if (muted) {
          if ("speechSynthesis" in window) window.speechSynthesis.cancel();
          if (currentAudioEl) { currentAudioEl.pause(); currentAudioEl = null; }
        }
      },
      isMuted(){ return muted; }
    };
  })();

  /* ============================================================
     PROGRESS PERSISTENCE — this module has no PL/mastery concept
     (passThreshold is null in the JSON), so the record intentionally
     omits performanceLevel/hintsUsed/masteryAchieved rather than
     fabricating values that wouldn't mean anything. hub.html reads
     `songsExplored` for this module's badge instead of masteryAchieved.
     ============================================================ */
  async function saveProgress(record){
    try {
      await setDoc(doc(db, "progress", `${record.studentId}_${record.moduleId}`), record);
    } catch (e) {
      console.error("[progress] Firestore write failed", e);
    }
  }
  function getStudentId(){
    return localStorage.getItem(STUDENT_ID_KEY) || "guest_" + Math.random().toString(36).slice(2, 8);
  }

  /* ============================================================
     GAME STATE
     ============================================================ */
  const els = {
    startScreen: document.getElementById("startScreen"),
    gameScreen: document.getElementById("gameScreen"),
    resultsScreen: document.getElementById("resultsScreen"),
    titleBm: document.getElementById("titleBm"),
    titleEn: document.getElementById("titleEn"),
    instructionsText: document.getElementById("instructionsText"),
    startBtn: document.getElementById("startBtn"),
    backBtn: document.getElementById("backBtn"),
    muteBtn: document.getElementById("muteBtn"),
    songDots: document.getElementById("songDots"),
    songTitle: document.getElementById("songTitle"),
    verseText: document.getElementById("verseText"),
    speakerBtn: document.getElementById("speakerBtn"),
    rhymeLine: document.getElementById("rhymeLine"),
    answers: document.getElementById("answers"),
    feedbackBanner: document.getElementById("feedbackBanner"),
    nextBtn: document.getElementById("nextBtn"),
    playAgainBtn: document.getElementById("playAgainBtn"),
    doneBtn: document.getElementById("doneBtn"),
  };

  let moduleData = null;
  let order = [];
  let index = 0;
  let solved = false;
  let songsExplored = 0;

  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function loadModule(){
    fetch(CONTENT_URL)
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(data => {
        moduleData = data;
        els.titleBm.textContent = data.title.bm;
        els.titleEn.textContent = data.title.en;
        els.instructionsText.textContent = data.instructions.en;
      })
      .catch(err => {
        els.instructionsText.textContent =
          "Could not load module content (" + err.message + "). " +
          "Serve this folder over http(s):// — opening the file directly " +
          "blocks the fetch() to " + CONTENT_URL + ".";
        els.startBtn.disabled = true;
        els.startBtn.style.opacity = 0.5;
      });
  }

  function showScreen(name){
    els.startScreen.classList.toggle("hidden", name !== "start");
    els.gameScreen.classList.toggle("hidden", name !== "game");
    els.resultsScreen.classList.toggle("hidden", name !== "results");
  }

  function startSession(){
    order = shuffle(moduleData.items.map((_, i) => i));
    index = 0;
    songsExplored = 0;
    renderDots();
    showScreen("game");
    loadSong();
  }

  function renderDots(){
    els.songDots.innerHTML = "";
    order.forEach((_, i) => {
      const dot = document.createElement("div");
      dot.className = "song-dot" + (i < index ? " visited" : "");
      els.songDots.appendChild(dot);
    });
  }

  function loadSong(){
    renderDots();
    const item = moduleData.items[order[index]];
    solved = false;

    els.songTitle.textContent = item.title.en;
    els.verseText.textContent = item.verseText.en;
    els.rhymeLine.innerHTML = item.rhymeTargetLine.replace("___", '<span class="rhyme-blank" id="rhymeBlank">?</span>');
    els.feedbackBanner.textContent = "";
    els.nextBtn.classList.remove("invite");

    const options = shuffle([item.correctRhymeWord, ...item.distractorWords]);
    els.answers.innerHTML = "";
    options.forEach(word => {
      const btn = document.createElement("button");
      btn.className = "answer-btn";
      btn.textContent = word;
      btn.addEventListener("click", () => handleWordTap(word, btn, item));
      els.answers.appendChild(btn);
    });

    playCurrentVerse();
  }

  function playCurrentVerse(){
    els.speakerBtn.classList.add("playing");
    AudioEngine.speakVerse(moduleData.items[order[index]], () => {
      els.speakerBtn.classList.remove("playing");
    });
  }

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  function handleWordTap(word, btn, item){
    if (solved) return;
    if (word === item.correctRhymeWord) {
      solved = true;
      btn.classList.add("found-correct");
      const blank = document.getElementById("rhymeBlank");
      if (blank) blank.textContent = word;
      AudioEngine.playFoundRhyme();
      els.feedbackBanner.textContent = pick(moduleData.feedback.correct);
      Array.from(els.answers.children).forEach(b => { if (b !== btn) b.classList.add("solved-disabled"); });
      els.nextBtn.classList.add("invite");
    } else {
      btn.classList.add("try-again");
      setTimeout(() => btn.classList.remove("try-again"), 400);
      AudioEngine.playTryAgain();
      els.feedbackBanner.textContent = pick(moduleData.feedback.tryAgain);
    }
  }

  function goNext(){
    if (index < order.length - 1) {
      index++;
      songsExplored = Math.max(songsExplored, index);
      loadSong();
    } else {
      songsExplored = order.length;
      endSession();
    }
  }

  function endSession(){
    saveProgress({
      studentId: getStudentId(),
      moduleId: moduleData.moduleId,
      songsExplored,
      lastPlayed: new Date().toISOString()
    });
    renderDots();
    AudioEngine.playAllExplored();
    showScreen("results");
  }

  /* ============================================================
     EVENTS
     ============================================================ */
  els.startBtn.addEventListener("click", startSession);
  els.speakerBtn.addEventListener("click", playCurrentVerse);
  els.nextBtn.addEventListener("click", goNext);
  els.playAgainBtn.addEventListener("click", startSession);
  els.backBtn.addEventListener("click", () => { window.location.href = "../hub.html"; });
  els.doneBtn.addEventListener("click", () => { window.location.href = "../hub.html"; });
  els.muteBtn.addEventListener("click", () => {
    const next = !AudioEngine.isMuted();
    AudioEngine.setMuted(next);
    els.muteBtn.textContent = next ? "🔇" : "🔊";
  });

  loadModule();
</script>
</body>
</html>
