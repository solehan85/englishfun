<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Trace the Letter — Eduverse English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#ffe3ec; --bg-2:#e5f6ff; --bg-3:#fff6e5;
    --ink:#2b2b3d; --card:#ffffff;
    --brand:#ff5d8f; --brand-dark:#c9285f;
    --good:#06d6a0; --good-dark:#039e77;
    --bad:#ff5d5d; --bad-dark:#d63f3f;
    --hint:#ffb84d; --hint-dark:#e0952a;
    --radius:22px;
    --shadow:0 8px 0 rgba(0,0,0,.12);
    --font-display:'Baloo 2',cursive; --font-body:'Nunito',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--font-body);
    background:linear-gradient(160deg,var(--bg-1),var(--bg-3) 55%,var(--bg-2));
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    min-height:100%;
    padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
    overflow-x:hidden;
  }
  .screen{ width:100%; max-width:520px; display:flex; flex-direction:column; align-items:center; flex:1; padding:16px 0 32px; }
  .hidden{ display:none !important; }

  .topbar{ width:100%; max-width:520px; display:flex; align-items:center; gap:10px; padding:10px 4px; }
  .icon-btn{
    border:none; background:var(--card); box-shadow:var(--shadow); border-radius:16px;
    width:44px; height:44px; font-size:20px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:0 0 auto;
  }
  .icon-btn:active{ transform:translateY(4px); box-shadow:none; }
  .progress-track{ flex:1; height:14px; background:#ffffffaa; border-radius:999px; overflow:hidden; box-shadow:inset 0 2px 4px rgba(0,0,0,.08); }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg,var(--brand),#8a7dff); border-radius:999px; transition:width .35s ease; }

  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:28px 22px; width:100%; text-align:center;
  }
  .title-en{ font-family:var(--font-display); font-size:2rem; font-weight:700; margin:0; color:var(--brand-dark); }
  .title-bm{ font-size:1.1rem; color:#6a6a80; margin:4px 0 18px; font-weight:600; }
  .instructions{ font-size:1.05rem; line-height:1.5; background:#f4f2ff; border-radius:14px; padding:14px 16px; margin-bottom:22px; }
  .big-btn{
    border:none; cursor:pointer; font-weight:800; font-size:1.15rem;
    color:#fff; background:var(--brand); box-shadow:0 6px 0 var(--brand-dark);
    padding:16px 28px; border-radius:18px; width:100%; max-width:320px;
  }
  .big-btn:active{ transform:translateY(6px); box-shadow:none; }
  .big-btn.secondary{ background:var(--good); box-shadow:0 6px 0 var(--good-dark); margin-top:14px; }

  .stage{ width:100%; display:flex; flex-direction:column; align-items:center; gap:16px; margin-top:8px;}
  .scene{
    width:100%; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:20px 16px; display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .word-row{ display:flex; align-items:center; gap:10px; }
  .word-emoji{ font-size:2.2rem; }
  .word-label{ font-size:1.2rem; font-weight:800; color:#3a3a52; }
  .stroke-hint{ font-size:.88rem; color:#6a6a80; text-align:center; font-style:italic; min-height:1.2rem; }

  .canvas-wrap{
    width:100%; max-width:240px; aspect-ratio:100/150; position:relative;
    background:#faf9ff; border-radius:16px; border:2px solid #e6e4f5; overflow:hidden;
    touch-action:none;
  }
  .canvas-wrap canvas{ width:100%; height:100%; display:block; touch-action:none; }
  .demo-caption{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.85); font-weight:800; color:var(--brand-dark); font-size:.95rem; text-align:center; padding:10px;
  }

  .canvas-actions{ display:flex; gap:12px; width:100%; max-width:280px; }
  .action-btn{
    flex:1; border:none; cursor:pointer; font-weight:800; font-size:.95rem; padding:13px 0; border-radius:16px;
  }
  .clear-btn{ background:#f0eeff; color:var(--brand-dark); box-shadow:0 5px 0 #d8d4ff; }
  .check-btn{ background:var(--good); color:#fff; box-shadow:0 5px 0 var(--good-dark); }
  .action-btn:active{ transform:translateY(5px); box-shadow:none; }
  .action-btn:disabled{ opacity:.5; pointer-events:none; }

  .feedback-banner{ width:100%; text-align:center; font-weight:800; font-size:1.05rem; min-height:1.5rem; color:var(--ink); }

  .hint-row{ width:100%; display:flex; justify-content:center; }
  .hint-btn{
    border:none; cursor:pointer; background:var(--hint); color:#fff; font-weight:800;
    padding:12px 20px; border-radius:16px; box-shadow:0 5px 0 var(--hint-dark); font-size:.95rem;
    display:flex; align-items:center; gap:8px;
  }
  .hint-btn:active{ transform:translateY(5px); box-shadow:none; }
  .hint-btn:disabled{ opacity:.6; pointer-events:none; }
  .hint-panel{
    width:100%; background:#fff7e8; border:2px dashed var(--hint); border-radius:14px;
    padding:12px 14px; font-size:.95rem; text-align:center; color:#7a5b18;
  }

  .stars{ font-size:3rem; letter-spacing:6px; margin:10px 0 4px; }
  .result-msg{ font-family:var(--font-display); font-size:1.2rem; font-weight:700; margin-bottom:6px; color:var(--brand-dark); }
  .result-sub{ color:#6a6a80; margin-bottom:24px; font-size:.95rem; }
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" id="backBtn" aria-label="Back" title="Back">←</button>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <button class="icon-btn" id="muteBtn" aria-label="Toggle sound" title="Toggle sound">🔊</button>
</div>

<!-- START SCREEN -->
<section id="startScreen" class="screen">
  <div class="card">
    <p class="title-en" id="titleEn">Trace the Letter</p>
    <p class="title-bm" id="titleBm">Jejak Huruf</p>
    <p class="instructions" id="instructionsText">Use your finger to trace the letter. Follow the arrow from start to finish.</p>
    <button class="big-btn" id="startBtn">▶ Start</button>
  </div>
</section>

<!-- GAME SCREEN -->
<section id="gameScreen" class="screen hidden">
  <div class="stage">
    <div class="scene">
      <div class="word-row">
        <div class="word-emoji" id="wordEmoji">📝</div>
        <div class="word-label" id="wordLabel"></div>
      </div>
      <div class="stroke-hint" id="strokeHint"></div>

      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="traceCanvas"></canvas>
        <div class="demo-caption hidden" id="demoCaption">👀 Tengok cara tulis...</div>
      </div>

      <div class="canvas-actions">
        <button class="action-btn clear-btn" id="clearBtn">🧹 Padam</button>
        <button class="action-btn check-btn" id="checkBtn">✓ Semak</button>
      </div>
    </div>

    <div class="feedback-banner" id="feedbackBanner"></div>

    <div class="hint-row">
      <button class="hint-btn" id="hintBtn">💡 Tunjuk Cara</button>
    </div>
    <div class="hint-panel hidden" id="hintPanel"></div>
  </div>
</section>

<!-- RESULTS SCREEN -->
<section id="resultsScreen" class="screen hidden">
  <div class="card">
    <div class="stars" id="starsDisplay">⭐⭐⭐</div>
    <div class="result-msg" id="resultMsg">Great job!</div>
    <div class="result-sub" id="resultSub">You traced every letter.</div>
    <button class="big-btn secondary" id="playAgainBtn">🔁 Play Again</button>
    <button class="big-btn" id="doneBtn" style="margin-top:12px;background:#8a8aa3;box-shadow:0 6px 0 #6d6d85;">✓ Done</button>
  </div>
</section>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

  /* ============================================================
     Firebase config — same object duplicated in login.html, hub.html
     and every modules/*.html file (each screen is a self-contained
     page with no shared JS import). The API key is a public client
     identifier; access is controlled by Firestore security rules.
     ============================================================ */
  const firebaseConfig = {
    apiKey: "AIzaSyBtlViRgm26PuMPvNC9GoKA9hBwtYT-HEg",
    authDomain: "english-dbcda.firebaseapp.com",
    projectId: "english-dbcda",
    storageBucket: "english-dbcda.firebasestorage.app",
    messagingSenderId: "174382751098",
    appId: "1:174382751098:web:7736264ea3153970cd8ac3"
  };
  const firebaseApp = initializeApp(firebaseConfig);
  const db = getFirestore(firebaseApp);

  /* ============================================================
     CONFIG
     ============================================================ */
  const CONTENT_URL = "../content/year1/module-03-jejak-huruf.json";
  const STUDENT_ID_KEY = "eduverse_student_id"; // set by login.html

  const IMAGE_PLACEHOLDERS = {
    mother_figure: "👩", father_figure: "👨", baby_sibling: "👶",
    sister_figure: "👧", family_group: "👨‍👩‍👧‍👦", hand_icon: "✋",
    nose_icon: "👃", teeth_icon: "😁", pet_dog: "🐶",
    washing_hands: "🧼", heart_hug: "🤗", girl_figure: "👧",
    child_running: "🏃", family_cat: "🐱", brother_figure: "👦",
    orange_fruit: "🍊", eye_icon: "👁️"
  };
  const DEFAULT_EMOJI = "🔤";

  /* ============================================================
     LETTER GEOMETRY
     The content JSON only gives a plain-English strokeHint (e.g.
     "curve at the top, straight line down, then a short line across
     the middle") — there's no coordinate data, so the actual traceable
     paths are hand-authored here as simplified single-story print
     letterforms, in a 100×150 logical coordinate box.
     ============================================================ */
  const ASC = 20;     // ascender top
  const XTOP = 65;    // x-height top (x-height letters span XTOP..BASE)
  const BASE = 110;   // baseline
  const DESC = 140;   // descender bottom
  const BOWL_R = 22;  // radius for round-bowl letters (o, c, e, b, d, p, g)
  const VB_W = 100, VB_H = 150;

  function polyline(waypoints, stepsPerSeg){
    const pts = [];
    for (let i = 0; i < waypoints.length - 1; i++) {
      const [x1, y1] = waypoints[i], [x2, y2] = waypoints[i + 1];
      const start = i === 0 ? 0 : 1;
      for (let j = start; j <= stepsPerSeg; j++) {
        const t = j / stepsPerSeg;
        pts.push({ x: x1 + (x2 - x1) * t, y: y1 + (y2 - y1) * t });
      }
    }
    return pts;
  }
  function arc(cx, cy, r, startDeg, endDeg, steps){
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const rad = (startDeg + (endDeg - startDeg) * t) * Math.PI / 180;
      pts.push({ x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) });
    }
    return pts;
  }
  // A hump/arch: left leg meets an existing stem, arcs over the top,
  // then a right leg drops to the baseline (used by h, n, m).
  function archHump(cx, r, midY, baseY){
    const a = arc(cx, midY, r, 180, 360, 20);
    const leg = polyline([[cx + r, midY], [cx + r, baseY]], 15).slice(1);
    return [...a, ...leg];
  }

  const LETTER_STROKES = {
    l: [ polyline([[50, ASC], [50, BASE]], 20) ],
    t: [ polyline([[50, ASC + 5], [50, BASE]], 20), polyline([[35, 70], [65, 70]], 10) ],
    f: [
      [...arc(58, 32, 12, 270, 180, 12), ...polyline([[46, 32], [46, BASE]], 20).slice(1)],
      polyline([[34, 70], [58, 70]], 10)
    ],
    h: [ polyline([[32, ASC], [32, BASE]], 20), archHump(47, 15, 73, BASE) ],
    n: [ polyline([[32, XTOP], [32, BASE]], 20), archHump(47, 15, 73, BASE) ],
    w: [ polyline([[25, XTOP], [38, BASE], [50, XTOP + 15], [62, BASE], [75, XTOP]], 15) ],
    m: [
      polyline([[26, XTOP], [26, BASE]], 20),
      archHump(39, 13, 73, BASE),
      archHump(65, 13, 73, BASE)
    ],
    d: [ arc(40, BASE - BOWL_R, BOWL_R, 270, 630, 35), polyline([[62, ASC], [62, BASE]], 20) ],
    b: [ polyline([[36, ASC], [36, BASE]], 20), arc(58, BASE - BOWL_R, BOWL_R, 270, 630, 35) ],
    p: [ polyline([[36, XTOP], [36, DESC]], 20), arc(58, XTOP + BOWL_R, BOWL_R, 270, 630, 35) ],
    r: [ polyline([[36, XTOP], [36, BASE]], 20), arc(43, 68, 7, 180, 330, 10) ],
    s: [ polyline([[62, 72], [45, 68], [38, 78], [52, 90], [66, 100], [60, 110], [40, 112]], 8) ],
    c: [ arc(50, BASE - BOWL_R, BOWL_R, 280, 80, 30) ],
    o: [ arc(50, BASE - BOWL_R, BOWL_R, 270, 630, 40) ],
    e: [ [...polyline([[28, BASE - BOWL_R], [70, BASE - BOWL_R]], 15), ...arc(50, BASE - BOWL_R, BOWL_R, 0, 290, 30).slice(1)] ],
    g: [
      arc(50, BASE - BOWL_R, BOWL_R, 0, 360, 35),
      polyline([[70, 95], [70, 125], [55, 138], [38, 132]], 10)
    ]
  };

  /* ============================================================
     AUDIO ENGINE — only used for feedback chimes here; this
     mechanic has no NPC/word audio (visual/motor only, per the
     asset brief).
     ============================================================ */
  const AudioEngine = (function(){
    let muted = false;
    let ctx = null;
    function getCtx(){
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctx = new AC();
      }
      return ctx;
    }
    function tone(freq, duration, type){
      if (muted) return;
      const c = getCtx();
      if (!c) return;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, c.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + duration);
      osc.connect(gain).connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + duration + 0.02);
    }
    return {
      playCorrect(){ tone(660, 0.15, "sine"); setTimeout(() => tone(880, 0.22, "sine"), 130); },
      playIncorrect(){ tone(180, 0.28, "sawtooth"); },
      playComplete(){ [523,659,784,1047].forEach((f,idx)=>setTimeout(()=>tone(f,0.22,"sine"), idx*140)); },
      setMuted(v){ muted = v; },
      isMuted(){ return muted; }
    };
  })();

  /* ============================================================
     PL SCORING (reused unchanged).
     ============================================================ */
  function resolvePerformanceLevel(totalHints, table){
    for (const key in table) {
      if (key.endsWith("+")) {
        const min = parseInt(key, 10);
        if (totalHints >= min) return table[key];
      } else if (key.includes("-")) {
        const [min, max] = key.split("-").map(Number);
        if (totalHints >= min && totalHints <= max) return table[key];
      } else {
        if (totalHints === parseInt(key, 10)) return table[key];
      }
    }
    return 1;
  }

  async function saveProgress(record){
    try {
      await setDoc(doc(db, "progress", `${record.studentId}_${record.moduleId}`), record);
    } catch (e) {
      console.error("[progress] Firestore write failed", e);
    }
  }
  function getStudentId(){
    return localStorage.getItem(STUDENT_ID_KEY) || "guest_" + Math.random().toString(36).slice(2, 8);
  }

  /* ============================================================
     TRACE CANVAS ENGINE
     Accuracy is direction-agnostic spatial coverage: the % of guide
     sample points that have some ink drawn within a loose tolerance
     (per validationLogic in the JSON: "garis panduan longgar, bukan
     ketat" — motor-skill effort, not calligraphy precision). Multiple
     pen-lifts are allowed and pooled into one combined ink set rather
     than gated per-stroke, since strict stroke ORDER isn't specified.
     ============================================================ */
  const SCALE = 3;
  const TOLERANCE = 9; // logical units (canvas is 100 units wide)
  const canvas = document.getElementById("traceCanvas");
  const ctx = canvas.getContext("2d");
  canvas.width = VB_W * SCALE;
  canvas.height = VB_H * SCALE;
  ctx.scale(SCALE, SCALE);

  let guidePointsFlat = [];
  let inkStrokes = [];
  let activeStroke = null;
  let drawingEnabled = true;

  function drawGuide(strokes){
    ctx.clearRect(0, 0, VB_W, VB_H);
    ctx.save();
    ctx.strokeStyle = "#c9c5e8";
    ctx.lineWidth = 3;
    ctx.setLineDash([4, 5]);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    strokes.forEach(stroke => {
      ctx.beginPath();
      stroke.forEach((p, i) => { i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); });
      ctx.stroke();
    });
    ctx.restore();

    // Start dot on the very first stroke's first point.
    const start = strokes[0][0];
    ctx.save();
    ctx.fillStyle = "#2ecc71";
    ctx.beginPath();
    ctx.arc(start.x, start.y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawInk(){
    ctx.save();
    ctx.strokeStyle = "#5b4bff";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    inkStrokes.forEach(stroke => {
      if (stroke.length < 2) return;
      ctx.beginPath();
      stroke.forEach((p, i) => { i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); });
      ctx.stroke();
    });
    ctx.restore();
  }

  function redraw(currentStrokes){
    drawGuide(currentStrokes);
    drawInk();
  }

  function pointerToLogical(evt){
    const rect = canvas.getBoundingClientRect();
    return {
      x: (evt.clientX - rect.left) / rect.width * VB_W,
      y: (evt.clientY - rect.top) / rect.height * VB_H
    };
  }

  let currentGuideStrokes = null;

  canvas.addEventListener("pointerdown", (evt) => {
    if (!drawingEnabled) return;
    canvas.setPointerCapture(evt.pointerId);
    activeStroke = [pointerToLogical(evt)];
    inkStrokes.push(activeStroke);
    redraw(currentGuideStrokes);
  });
  canvas.addEventListener("pointermove", (evt) => {
    if (!drawingEnabled || !activeStroke) return;
    const p = pointerToLogical(evt);
    const last = activeStroke[activeStroke.length - 1];
    if (Math.hypot(p.x - last.x, p.y - last.y) < 1.2) return; // thin out dense move events
    activeStroke.push(p);
    redraw(currentGuideStrokes);
  });
  function endStroke(){ activeStroke = null; }
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointercancel", endStroke);
  canvas.addEventListener("pointerleave", endStroke);

  function computeAccuracy(){
    const inkPoints = inkStrokes.flat();
    if (inkPoints.length === 0) return 0;
    let covered = 0;
    for (const gp of guidePointsFlat) {
      const hit = inkPoints.some(ip => {
        const dx = gp.x - ip.x, dy = gp.y - ip.y;
        return dx * dx + dy * dy <= TOLERANCE * TOLERANCE;
      });
      if (hit) covered++;
    }
    return Math.round((covered / guidePointsFlat.length) * 100);
  }

  function playDemo(strokes, onDone){
    drawingEnabled = false;
    els.demoCaption.classList.remove("hidden");
    els.checkBtn.disabled = true;
    els.clearBtn.disabled = true;

    let strokeIdx = 0;
    function animateStroke(){
      if (strokeIdx >= strokes.length) { finish(); return; }
      const pts = strokes[strokeIdx];
      let i = 0;
      const timer = setInterval(() => {
        redraw(currentGuideStrokes);
        ctx.save();
        ctx.fillStyle = "#ffb84d";
        ctx.beginPath();
        ctx.arc(pts[i].x, pts[i].y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        i++;
        if (i >= pts.length) {
          clearInterval(timer);
          strokeIdx++;
          setTimeout(animateStroke, 220);
        }
      }, 16);
    }
    function finish(){
      redraw(currentGuideStrokes);
      drawingEnabled = true;
      els.demoCaption.classList.add("hidden");
      els.checkBtn.disabled = false;
      els.clearBtn.disabled = false;
      if (onDone) onDone();
    }
    animateStroke();
  }

  /* ============================================================
     GAME STATE
     ============================================================ */
  const els = {
    startScreen: document.getElementById("startScreen"),
    gameScreen: document.getElementById("gameScreen"),
    resultsScreen: document.getElementById("resultsScreen"),
    titleBm: document.getElementById("titleBm"),
    titleEn: document.getElementById("titleEn"),
    instructionsText: document.getElementById("instructionsText"),
    startBtn: document.getElementById("startBtn"),
    backBtn: document.getElementById("backBtn"),
    muteBtn: document.getElementById("muteBtn"),
    progressFill: document.getElementById("progressFill"),
    wordEmoji: document.getElementById("wordEmoji"),
    wordLabel: document.getElementById("wordLabel"),
    strokeHint: document.getElementById("strokeHint"),
    demoCaption: document.getElementById("demoCaption"),
    clearBtn: document.getElementById("clearBtn"),
    checkBtn: document.getElementById("checkBtn"),
    feedbackBanner: document.getElementById("feedbackBanner"),
    hintBtn: document.getElementById("hintBtn"),
    hintPanel: document.getElementById("hintPanel"),
    starsDisplay: document.getElementById("starsDisplay"),
    resultMsg: document.getElementById("resultMsg"),
    resultSub: document.getElementById("resultSub"),
    playAgainBtn: document.getElementById("playAgainBtn"),
    doneBtn: document.getElementById("doneBtn"),
  };

  let moduleData = null;
  let pool = { 1: [], 2: [], 3: [] };
  let playedCount = 0;
  let totalItems = 0;
  let currentTier = 1;
  let currentItem = null;
  let itemHints = 0;
  let itemWrongAttempts = 0;
  let consecutiveLowAttempts = 0;
  let sessionHints = 0;
  let sessionAttempts = 0;

  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function initPools(items){
    pool = { 1: [], 2: [], 3: [] };
    items.forEach(it => {
      const tier = pool[it.difficultyTier] ? it.difficultyTier : 1;
      pool[tier].push(it);
    });
    Object.keys(pool).forEach(t => { pool[t] = shuffle(pool[t]); });
  }
  function pickNextItem(){
    const order = [currentTier, currentTier - 1, currentTier + 1, 1, 2, 3];
    for (const t of order) {
      if (pool[t] && pool[t].length) return pool[t].shift();
    }
    return null;
  }

  function loadModule(){
    fetch(CONTENT_URL)
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(data => {
        moduleData = data;
        els.titleBm.textContent = data.title.bm;
        els.titleEn.textContent = data.title.en;
        els.instructionsText.textContent = data.instructions.en;
        initPools(data.items);
        totalItems = data.items.length;
      })
      .catch(err => {
        els.instructionsText.textContent =
          "Could not load module content (" + err.message + "). " +
          "Serve this folder over http(s):// — opening the file directly " +
          "blocks the fetch() to " + CONTENT_URL + ".";
        els.startBtn.disabled = true;
        els.startBtn.style.opacity = 0.5;
      });
  }

  function showScreen(name){
    els.startScreen.classList.toggle("hidden", name !== "start");
    els.gameScreen.classList.toggle("hidden", name !== "game");
    els.resultsScreen.classList.toggle("hidden", name !== "results");
  }

  function startSession(){
    playedCount = 0;
    sessionHints = 0;
    sessionAttempts = 0;
    currentTier = 1;
    initPools(moduleData.items);
    showScreen("game");
    nextItem();
  }

  function updateProgressBar(){
    const pct = totalItems ? Math.round((playedCount / totalItems) * 100) : 0;
    els.progressFill.style.width = pct + "%";
  }

  function resetCanvasForItem(item){
    currentGuideStrokes = LETTER_STROKES[item.targetGrapheme];
    guidePointsFlat = currentGuideStrokes.flat();
    inkStrokes = [];
    activeStroke = null;
    redraw(currentGuideStrokes);
  }

  function nextItem(){
    updateProgressBar();
    const item = pickNextItem();
    if (!item) { endSession(); return; }
    currentItem = item;
    itemHints = 0;
    itemWrongAttempts = 0;
    consecutiveLowAttempts = 0;

    els.wordEmoji.textContent = IMAGE_PLACEHOLDERS[item.imageAsset] || DEFAULT_EMOJI;
    els.wordLabel.textContent = item.contextWord.en;
    els.strokeHint.textContent = item.strokeHint;
    els.feedbackBanner.textContent = "";
    els.hintPanel.classList.add("hidden");
    els.hintBtn.disabled = false;
    els.hintBtn.style.opacity = 1;
    els.hintBtn.classList.remove("hint-pulse");
    els.checkBtn.disabled = false;
    els.clearBtn.disabled = false;

    resetCanvasForItem(item);
  }

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  els.clearBtn.addEventListener("click", () => {
    inkStrokes = [];
    activeStroke = null;
    redraw(currentGuideStrokes);
    els.feedbackBanner.textContent = "";
  });

  els.checkBtn.addEventListener("click", () => {
    if (inkStrokes.flat().length === 0) {
      els.feedbackBanner.style.color = "var(--bad-dark)";
      els.feedbackBanner.textContent = "Trace the letter first!";
      return;
    }
    sessionAttempts++;
    const accuracy = computeAccuracy();

    if (accuracy >= 70) {
      AudioEngine.playCorrect();
      els.feedbackBanner.style.color = "var(--good-dark)";
      els.feedbackBanner.textContent = pick(moduleData.feedback.correct);
      els.checkBtn.disabled = true;
      els.clearBtn.disabled = true;
      playedCount++;

      if (itemHints > 0 || itemWrongAttempts > 0) {
        currentTier = Math.max(1, currentTier - 1);
      } else {
        currentTier = Math.min(3, currentTier + 1);
      }
      setTimeout(nextItem, 900);
    } else {
      itemWrongAttempts++;
      AudioEngine.playIncorrect();
      els.feedbackBanner.style.color = "var(--bad-dark)";
      els.feedbackBanner.textContent = pick(moduleData.feedback.incorrect);

      if (accuracy < 50) {
        consecutiveLowAttempts++;
        if (consecutiveLowAttempts >= 2) {
          consecutiveLowAttempts = 0;
          itemHints++;
          sessionHints++;
          setTimeout(() => playDemo(currentGuideStrokes), 400);
        }
      } else {
        consecutiveLowAttempts = 0;
      }

      inkStrokes = [];
      activeStroke = null;
      redraw(currentGuideStrokes);
    }
  });

  els.hintBtn.addEventListener("click", () => {
    itemHints++;
    sessionHints++;
    consecutiveLowAttempts = 0;
    els.hintPanel.textContent = moduleData.feedback.hint;
    els.hintPanel.classList.remove("hidden");
    els.hintBtn.classList.remove("hint-pulse");
    playDemo(currentGuideStrokes);
  });

  function endSession(){
    const pl = resolvePerformanceLevel(sessionHints, moduleData.validationLogic.hintsUsed_to_PL);
    const masteryAchieved = pl >= moduleData.validationLogic.passThreshold;

    saveProgress({
      studentId: getStudentId(),
      moduleId: moduleData.moduleId,
      performanceLevel: pl,
      hintsUsed: sessionHints,
      attempts: sessionAttempts,
      masteryAchieved,
      lastPlayed: new Date().toISOString()
    });

    renderResults(pl, masteryAchieved);
    showScreen("results");
  }

  function renderResults(pl, masteryAchieved){
    let stars = 1, msg = "Good try!", sub = "Let's practise more letters next time.";
    if (pl >= 5) { stars = 3; msg = "Amazing writing!"; sub = "You traced every letter brilliantly!"; }
    else if (pl >= 3) { stars = 2; msg = "Well done!"; sub = "You traced most of the letters!"; }
    else { stars = 1; msg = "Nice try!"; sub = "Keep practising — you're learning!"; }

    els.starsDisplay.textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
    els.resultMsg.textContent = msg;
    els.resultSub.textContent = sub + (masteryAchieved ? "" : " Play again to master this set.");
    if (masteryAchieved) AudioEngine.playComplete();
  }

  /* ============================================================
     EVENTS
     ============================================================ */
  els.startBtn.addEventListener("click", startSession);
  els.playAgainBtn.addEventListener("click", startSession);
  els.backBtn.addEventListener("click", () => { window.location.href = "../hub.html"; });
  els.doneBtn.addEventListener("click", () => { window.location.href = "../hub.html"; });
  els.muteBtn.addEventListener("click", () => {
    const next = !AudioEngine.isMuted();
    AudioEngine.setMuted(next);
    els.muteBtn.textContent = next ? "🔇" : "🔊";
  });

  const style = document.createElement("style");
  style.textContent = `.hint-pulse{ animation:pulse .6s ease-in-out infinite; } @keyframes pulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }`;
  document.head.appendChild(style);

  loadModule();
</script>
</body>
</html>
