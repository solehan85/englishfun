<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Build My Story — Eduverse English</title>
<style>
  :root{
    --bg-1:#eafbea; --bg-2:#fff3e0;
    --ink:#2b2b3d; --card:#ffffff;
    --brand:#2f9e58; --brand-dark:#1f7a41;
    --good:#2ecc71; --good-dark:#1f9e57;
    --bad:#ff5d5d; --bad-dark:#d63f3f;
    --hint:#ffb84d; --hint-dark:#e0952a;
    --radius:22px;
    --shadow:0 8px 0 rgba(0,0,0,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,var(--bg-1),var(--bg-2));
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    min-height:100%;
    padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
    overflow-x:hidden;
  }
  .screen{ width:100%; max-width:560px; display:flex; flex-direction:column; align-items:center; flex:1; padding:16px 0 32px; }
  .hidden{ display:none !important; }

  .topbar{ width:100%; max-width:560px; display:flex; align-items:center; gap:10px; padding:10px 4px; }
  .icon-btn{
    border:none; background:var(--card); box-shadow:var(--shadow); border-radius:16px;
    width:44px; height:44px; font-size:20px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:0 0 auto;
  }
  .icon-btn:active{ transform:translateY(4px); box-shadow:none; }
  .progress-track{ flex:1; height:14px; background:#ffffffaa; border-radius:999px; overflow:hidden; box-shadow:inset 0 2px 4px rgba(0,0,0,.08); }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg,var(--brand),#6fcf8f); border-radius:999px; transition:width .35s ease; }

  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:28px 22px; width:100%; text-align:center;
  }
  .title-en{ font-size:2rem; font-weight:800; margin:0; }
  .title-bm{ font-size:1.1rem; color:#6a6a80; margin:4px 0 18px; font-weight:600; }
  .instructions{ font-size:1.05rem; line-height:1.5; background:#eafbea; border-radius:14px; padding:14px 16px; margin-bottom:22px; }
  .big-btn{
    border:none; cursor:pointer; font-weight:800; font-size:1.15rem;
    color:#fff; background:var(--brand); box-shadow:0 6px 0 var(--brand-dark);
    padding:16px 28px; border-radius:18px; width:100%; max-width:320px;
  }
  .big-btn:active{ transform:translateY(6px); box-shadow:none; }
  .big-btn.secondary{ background:var(--good); box-shadow:0 6px 0 var(--good-dark); margin-top:14px; }

  .stage{ width:100%; display:flex; flex-direction:column; align-items:center; gap:16px; margin-top:4px;}
  .story-title{ font-size:1.25rem; font-weight:800; color:var(--brand-dark); }

  .slots-row{ width:100%; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .slot{
    aspect-ratio:1/1; border:3px dashed #cdeecd; border-radius:16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#f4fbf4; cursor:default; padding:6px; position:relative;
  }
  .slot-num{ position:absolute; top:4px; left:6px; font-size:.7rem; font-weight:800; color:#8fae94; }
  .slot.filled{ border-style:solid; border-color:var(--brand); background:#eafbea; cursor:pointer; }
  .slot.filled:active{ transform:scale(.95); }
  .slot .slot-emoji{ font-size:1.6rem; }
  .slot.correct{ border-color:var(--good); background:var(--good); animation:bounce .5s ease; }
  .slot.incorrect{ border-color:var(--bad); background:var(--bad); animation:shake .4s ease; }
  @keyframes bounce{ 0%{transform:scale(1);} 40%{transform:scale(1.1);} 100%{transform:scale(1);} }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  .panel-pool{ width:100%; display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .panel-card{
    border:none; cursor:pointer; text-align:left; padding:14px; border-radius:16px;
    background:var(--card); box-shadow:0 6px 0 #d8ecd8; display:flex; flex-direction:column; gap:6px;
  }
  .panel-card:active{ transform:translateY(6px); box-shadow:none; }
  .panel-card.used{ opacity:0; transform:scale(.5); pointer-events:none; }
  .panel-emoji{ font-size:1.8rem; }
  .panel-caption{ font-size:.8rem; color:#4a4a5c; line-height:1.3; }

  .feedback-banner{ width:100%; text-align:center; font-weight:800; font-size:1.05rem; min-height:1.5rem; color:var(--ink); }

  .hint-row{ width:100%; display:flex; justify-content:center; }
  .hint-btn{
    border:none; cursor:pointer; background:var(--hint); color:#fff; font-weight:800;
    padding:12px 20px; border-radius:16px; box-shadow:0 5px 0 var(--hint-dark); font-size:.95rem;
    display:flex; align-items:center; gap:8px;
  }
  .hint-btn:active{ transform:translateY(5px); box-shadow:none; }
  .hint-btn.hint-pulse{ animation:pulse .6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
  .hint-panel{
    width:100%; background:#fff7e8; border:2px dashed var(--hint); border-radius:14px;
    padding:12px 14px; font-size:.95rem; text-align:center; color:#7a5b18;
  }

  .stars{ font-size:3rem; letter-spacing:6px; margin:10px 0 4px; }
  .result-msg{ font-size:1.2rem; font-weight:800; margin-bottom:6px; }
  .result-sub{ color:#6a6a80; margin-bottom:24px; font-size:.95rem; }

  @media (min-width:480px){
    .panel-pool{ grid-template-columns:repeat(4,1fr); }
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" id="backBtn" aria-label="Back" title="Back">←</button>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
</div>

<!-- START SCREEN -->
<section id="startScreen" class="screen">
  <div class="card">
    <p class="title-en" id="titleEn">Build My Story</p>
    <p class="title-bm" id="titleBm">Bina Ceritaku</p>
    <p class="instructions" id="instructionsText">Look at the story pictures. Drag them into the correct order — what happens first, next, and last?</p>
    <button class="big-btn" id="startBtn">▶ Start</button>
  </div>
</section>

<!-- GAME SCREEN -->
<section id="gameScreen" class="screen hidden">
  <div class="stage">
    <div class="story-title" id="storyTitle">Kancil and the Crocodiles</div>

    <div class="slots-row" id="slotsRow"></div>

    <div class="panel-pool" id="panelPool"></div>

    <div class="feedback-banner" id="feedbackBanner"></div>

    <div class="hint-row">
      <button class="hint-btn" id="hintBtn">💡 Hint</button>
    </div>
    <div class="hint-panel hidden" id="hintPanel"></div>
  </div>
</section>

<!-- RESULTS SCREEN -->
<section id="resultsScreen" class="screen hidden">
  <div class="card">
    <div class="stars" id="starsDisplay">⭐⭐⭐</div>
    <div class="result-msg" id="resultMsg">Great job!</div>
    <div class="result-sub" id="resultSub">You told every story in order.</div>
    <button class="big-btn secondary" id="playAgainBtn">🔁 Play Again</button>
    <button class="big-btn" id="doneBtn" style="margin-top:12px;background:#8a8aa3;box-shadow:0 6px 0 #6d6d85;">✓ Done</button>
  </div>
</section>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

  /* ============================================================
     Firebase config — same object duplicated in login.html, hub.html
     and every modules/*.html file (each screen is a self-contained
     page with no shared JS import). The API key is a public client
     identifier; access is controlled by Firestore security rules.
     ============================================================ */
  const firebaseConfig = {
    apiKey: "AIzaSyBtlViRgm26PuMPvNC9GoKA9hBwtYT-HEg",
    authDomain: "english-dbcda.firebaseapp.com",
    projectId: "english-dbcda",
    storageBucket: "english-dbcda.firebasestorage.app",
    messagingSenderId: "174382751098",
    appId: "1:174382751098:web:7736264ea3153970cd8ac3"
  };
  const firebaseApp = initializeApp(firebaseConfig);
  const db = getFirestore(firebaseApp);

  /* ============================================================
     CONFIG — Year 2 content, so this reads from content/year2/,
     unlike modules 1-7 which are all Year 1.
     ============================================================ */
  const CONTENT_URL = "../content/year2/module-08-bina-ceritaku.json";
  const STUDENT_ID_KEY = "eduverse_student_id"; // set by login.html

  /* ============================================================
     Panel placeholders — these 16 story-panel scenes are unique to
     this module's 4 Kancil stories (not shared with earlier modules'
     icon set), so each gets its own small emoji-combo standing in
     for real illustration until that asset phase happens.
     ============================================================ */
  const PANEL_EMOJI = {
    kancil_hungry_riverbank: "🦌🌊", kancil_talks_crocodile: "🦌💬🐊",
    kancil_hops_crocodiles: "🦌🐊🐊", kancil_eats_fruit: "🦌🍈",
    kancil_meets_tiger: "🦌🐯", kancil_points_trap: "🦌👉📦",
    tiger_enters_cage: "🐯📦", kancil_closes_cage: "🔒📦",
    kancil_lost_path: "🦌❓", kancil_finds_beehive: "🦌🐝",
    kancil_asks_bees: "🦌💬🐝", kancil_walks_home: "🦌🏠",
    kancil_finds_big_fruit: "🦌🍈✨", kancil_calls_friends: "🦌📢",
    friends_share_fruit: "🍈✂️🦌", friends_happy_together: "🎉🦌🐿️"
  };
  const DEFAULT_EMOJI = "🖼️";

  /* ============================================================
     AUDIO ENGINE — chimes only; this mechanic is visual/reading
     (Language Arts, Creation), no audio content per the asset brief.
     ============================================================ */
  const AudioEngine = (function(){
    let ctx = null;
    function getCtx(){
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctx = new AC();
      }
      return ctx;
    }
    function tone(freq, duration, type){
      const c = getCtx();
      if (!c) return;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, c.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + duration);
      osc.connect(gain).connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + duration + 0.02);
    }
    return {
      playCorrect(){ tone(660, 0.15, "sine"); setTimeout(() => tone(880, 0.22, "sine"), 130); },
      playIncorrect(){ tone(180, 0.28, "sawtooth"); },
      playComplete(){ [523,659,784,1047].forEach((f,idx)=>setTimeout(()=>tone(f,0.22,"sine"), idx*140)); }
    };
  })();

  /* ============================================================
     PL SCORING (reused unchanged — this module's table just has
     finer-grained single-hint keys since there are only 4 stories).
     ============================================================ */
  function resolvePerformanceLevel(totalHints, table){
    for (const key in table) {
      if (key.endsWith("+")) {
        const min = parseInt(key, 10);
        if (totalHints >= min) return table[key];
      } else if (key.includes("-")) {
        const [min, max] = key.split("-").map(Number);
        if (totalHints >= min && totalHints <= max) return table[key];
      } else {
        if (totalHints === parseInt(key, 10)) return table[key];
      }
    }
    return 1;
  }

  async function saveProgress(record){
    try {
      await setDoc(doc(db, "progress", `${record.studentId}_${record.moduleId}`), record);
    } catch (e) {
      console.error("[progress] Firestore write failed", e);
    }
  }
  function getStudentId(){
    return localStorage.getItem(STUDENT_ID_KEY) || "guest_" + Math.random().toString(36).slice(2, 8);
  }

  /* ============================================================
     GAME STATE
     ============================================================ */
  const els = {
    startScreen: document.getElementById("startScreen"),
    gameScreen: document.getElementById("gameScreen"),
    resultsScreen: document.getElementById("resultsScreen"),
    titleBm: document.getElementById("titleBm"),
    titleEn: document.getElementById("titleEn"),
    instructionsText: document.getElementById("instructionsText"),
    startBtn: document.getElementById("startBtn"),
    backBtn: document.getElementById("backBtn"),
    progressFill: document.getElementById("progressFill"),
    storyTitle: document.getElementById("storyTitle"),
    slotsRow: document.getElementById("slotsRow"),
    panelPool: document.getElementById("panelPool"),
    feedbackBanner: document.getElementById("feedbackBanner"),
    hintBtn: document.getElementById("hintBtn"),
    hintPanel: document.getElementById("hintPanel"),
    starsDisplay: document.getElementById("starsDisplay"),
    resultMsg: document.getElementById("resultMsg"),
    resultSub: document.getElementById("resultSub"),
    playAgainBtn: document.getElementById("playAgainBtn"),
    doneBtn: document.getElementById("doneBtn"),
  };

  let moduleData = null;
  let storyOrder = [];
  let storyIndex = 0;
  let currentSet = null;
  let itemHints = 0;
  let itemWrongAttempts = 0;
  let sessionHints = 0;
  let sessionAttempts = 0;
  let locked = false;

  let slots = [null, null, null, null];
  let panelButtons = [];

  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function loadModule(){
    fetch(CONTENT_URL)
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(data => {
        moduleData = data;
        els.titleBm.textContent = data.title.bm;
        els.titleEn.textContent = data.title.en;
        els.instructionsText.textContent = data.instructions.en;
      })
      .catch(err => {
        els.instructionsText.textContent =
          "Could not load module content (" + err.message + "). " +
          "Serve this folder over http(s):// — opening the file directly " +
          "blocks the fetch() to " + CONTENT_URL + ".";
        els.startBtn.disabled = true;
        els.startBtn.style.opacity = 0.5;
      });
  }

  function showScreen(name){
    els.startScreen.classList.toggle("hidden", name !== "start");
    els.gameScreen.classList.toggle("hidden", name !== "game");
    els.resultsScreen.classList.toggle("hidden", name !== "results");
  }

  function startSession(){
    sessionHints = 0;
    sessionAttempts = 0;
    storyOrder = shuffle(moduleData.storySets.map((_, i) => i));
    storyIndex = 0;
    showScreen("game");
    loadStory();
  }

  function updateProgressBar(){
    const pct = Math.round((storyIndex / storyOrder.length) * 100);
    els.progressFill.style.width = pct + "%";
  }

  function renderSlots(){
    els.slotsRow.innerHTML = "";
    slots.forEach((entry, i) => {
      const slot = document.createElement("div");
      slot.className = "slot" + (entry ? " filled" : "");
      slot.innerHTML = `<div class="slot-num">${i + 1}</div>` +
        (entry ? `<div class="slot-emoji">${PANEL_EMOJI[entry.panel.imageAsset] || DEFAULT_EMOJI}</div>` : "");
      if (entry) slot.addEventListener("click", () => removeFromSlot(i));
      els.slotsRow.appendChild(slot);
    });
  }

  function loadStory(){
    updateProgressBar();
    if (storyIndex >= storyOrder.length) { endSession(); return; }
    currentSet = moduleData.storySets[storyOrder[storyIndex]];
    itemHints = 0;
    itemWrongAttempts = 0;
    locked = false;
    slots = [null, null, null, null];

    els.storyTitle.textContent = currentSet.title.en;
    els.feedbackBanner.textContent = "";
    els.hintPanel.classList.add("hidden");
    els.hintBtn.disabled = false;
    els.hintBtn.style.opacity = 1;
    els.hintBtn.classList.remove("hint-pulse");

    const shuffledPanels = shuffle(currentSet.panels);
    els.panelPool.innerHTML = "";
    panelButtons = shuffledPanels.map(panel => {
      const btn = document.createElement("button");
      btn.className = "panel-card";
      btn.innerHTML = `<div class="panel-emoji">${PANEL_EMOJI[panel.imageAsset] || DEFAULT_EMOJI}</div>` +
        `<div class="panel-caption">${panel.captionEn}</div>`;
      btn.addEventListener("click", () => placePanel(panel, btn));
      els.panelPool.appendChild(btn);
      return btn;
    });

    renderSlots();
  }

  function placePanel(panel, btn){
    if (locked || btn.classList.contains("used")) return;
    const emptyIndex = slots.findIndex(s => s === null);
    if (emptyIndex === -1) return;
    slots[emptyIndex] = { panel, btn };
    btn.classList.add("used");
    renderSlots();
    if (slots.every(s => s !== null)) checkSequence();
  }

  function removeFromSlot(index){
    if (locked) return;
    // Cascade: clear this slot and every slot after it, back to the pool.
    for (let i = index; i < slots.length; i++) {
      if (slots[i]) {
        slots[i].btn.classList.remove("used");
        slots[i] = null;
      }
    }
    renderSlots();
  }

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  function checkSequence(){
    sessionAttempts++;
    const isCorrect = slots.every((entry, i) => entry.panel.order === i + 1);

    if (isCorrect) {
      locked = true;
      Array.from(els.slotsRow.children).forEach(s => s.classList.add("correct"));
      AudioEngine.playCorrect();
      els.feedbackBanner.style.color = "var(--good-dark)";
      els.feedbackBanner.textContent = pick(moduleData.feedback.correct);
      storyIndex++;
      setTimeout(loadStory, 1200);
    } else {
      itemWrongAttempts++;
      Array.from(els.slotsRow.children).forEach(s => s.classList.add("incorrect"));
      AudioEngine.playIncorrect();
      els.feedbackBanner.style.color = "var(--bad-dark)";
      els.feedbackBanner.textContent = pick(moduleData.feedback.incorrect);

      if (itemWrongAttempts >= 2 && els.hintPanel.classList.contains("hidden")) {
        els.hintBtn.classList.add("hint-pulse");
      }

      setTimeout(() => {
        panelButtons.forEach(b => b.classList.remove("used"));
        slots = [null, null, null, null];
        renderSlots();
      }, 1000);
    }
  }

  function useHint(){
    if (locked) return;
    itemHints++;
    sessionHints++;
    els.hintPanel.textContent = moduleData.feedback.hint;
    els.hintPanel.classList.remove("hidden");
    els.hintBtn.classList.remove("hint-pulse");
  }

  function endSession(){
    const pl = resolvePerformanceLevel(sessionHints, moduleData.scoringLogic.hintsUsed_to_PL);
    const masteryAchieved = pl >= moduleData.scoringLogic.passThreshold;

    saveProgress({
      studentId: getStudentId(),
      moduleId: moduleData.moduleId,
      performanceLevel: pl,      // internal only — never shown as a grade/number
      hintsUsed: sessionHints,
      attempts: sessionAttempts,
      masteryAchieved,
      lastPlayed: new Date().toISOString()
    });

    renderResults(pl, masteryAchieved);
    showScreen("results");
  }

  function renderResults(pl, masteryAchieved){
    let stars = 1, msg = "Good try!", sub = "Let's tell more stories next time.";
    if (pl >= 5) { stars = 3; msg = "Amazing storytelling!"; sub = "You told every story perfectly!"; }
    else if (pl >= 3) { stars = 2; msg = "Well done!"; sub = "You told most of the stories in order!"; }
    else { stars = 1; msg = "Nice try!"; sub = "Keep practising — you're learning!"; }

    els.starsDisplay.textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
    els.resultMsg.textContent = msg;
    els.resultSub.textContent = sub + (masteryAchieved ? "" : " Play again to master this set.");
    if (masteryAchieved) AudioEngine.playComplete();
  }

  /* ============================================================
     EVENTS
     ============================================================ */
  els.startBtn.addEventListener("click", startSession);
  els.hintBtn.addEventListener("click", useHint);
  els.playAgainBtn.addEventListener("click", startSession);
  els.backBtn.addEventListener("click", () => { window.location.href = "../hub.html"; });
  els.doneBtn.addEventListener("click", () => { window.location.href = "../hub.html"; });

  loadModule();
</script>
</body>
</html>
