<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>My Progress — Eduverse English</title>
<style>
  :root{
    --bg-1:#fff6e5; --bg-2:#e5f6ff;
    --ink:#2b2b3d; --card:#ffffff;
    --brand:#5b4bff; --brand-dark:#3f31c9;
    --good:#2ecc71; --good-dark:#1f9e57;
    --muted:#8a8aa3; --muted-dark:#6d6d85;
    --radius:20px; --shadow:0 8px 0 rgba(0,0,0,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,var(--bg-1),var(--bg-2));
    color:var(--ink); min-height:100%; padding:16px 12px 40px;
  }
  .wrap{ max-width:640px; margin:0 auto; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:14px 16px; margin-bottom:20px;
  }
  .back-btn{
    border:none; cursor:pointer; background:#f0eeff; color:var(--brand-dark); font-weight:800;
    padding:10px 14px; border-radius:14px; font-size:.85rem; flex-shrink:0;
  }
  .back-btn:active{ transform:translateY(2px); }
  .welcome{ font-weight:800; font-size:1.05rem; text-align:center; }
  .welcome-sub{ font-weight:600; font-size:.85rem; color:#6a6a80; text-align:center; }

  .summary-card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:20px 16px; margin-bottom:22px; text-align:center;
  }
  .summary-title-primary{ font-weight:800; font-size:1.3rem; margin:0 0 2px; }
  .summary-title-secondary{ font-weight:600; font-size:.85rem; color:#6a6a80; margin:0 0 16px; }
  .summary-stats{ display:flex; justify-content:center; gap:22px; flex-wrap:wrap; }
  .stat{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .stat-value{ font-weight:800; font-size:1.6rem; color:var(--brand-dark); }
  .stat-label-primary{ font-weight:700; font-size:.78rem; }
  .stat-label-secondary{ font-weight:600; font-size:.68rem; color:#8a8aa3; }
  .stars-total{ font-size:1.3rem; letter-spacing:1px; }

  .world-section{ margin-bottom:24px; }
  .world-header{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .world-emoji{ font-size:1.6rem; }
  .world-title-primary{ font-weight:800; font-size:1.05rem; margin:0; }
  .world-title-secondary{ font-weight:600; font-size:.8rem; color:#6a6a80; margin:0; }

  .module-row{
    background:var(--card); border-radius:16px; box-shadow:var(--shadow);
    padding:12px 14px; margin-bottom:10px; display:flex; align-items:center; gap:12px;
  }
  .module-row-emoji{ font-size:1.5rem; flex-shrink:0; }
  .module-row-titles{ flex:1; min-width:0; }
  .module-row-title-primary{ font-weight:800; font-size:.9rem; line-height:1.2; }
  .module-row-title-secondary{ font-weight:600; font-size:.72rem; color:#6a6a80; line-height:1.1; }
  .module-row-status{ flex-shrink:0; text-align:right; }
  .stars-row{ font-size:1rem; letter-spacing:1px; }
  .status-text{ font-size:.72rem; font-weight:700; color:var(--muted-dark); }
  .status-text.explored{ color:#b85c26; }
  .status-text.mastered{ color:var(--good-dark); }

  .empty-note{ color:#8a8aa3; font-weight:600; font-size:.9rem; padding:8px 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="back-btn" id="backBtn">← Map</button>
    <div>
      <div class="welcome" id="welcomeText">My Progress</div>
      <div class="welcome-sub" id="yearText"></div>
    </div>
    <button class="back-btn" id="logoutBtn">Log Out</button>
  </div>

  <div class="summary-card">
    <p class="summary-title-primary">Your Progress</p>
    <p class="summary-title-secondary">Kemajuan Anda</p>
    <div class="summary-stats">
      <div class="stat">
        <div class="stat-value" id="statMastered">0/0</div>
        <div class="stat-label-primary">Mastered</div>
        <div class="stat-label-secondary">Dikuasai</div>
      </div>
      <div class="stat">
        <div class="stat-value stars-total" id="statStars">☆☆☆</div>
        <div class="stat-label-primary">Total Stars</div>
        <div class="stat-label-secondary">Jumlah Bintang</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statTried">0</div>
        <div class="stat-label-primary">Tried</div>
        <div class="stat-label-secondary">Dicuba</div>
      </div>
    </div>
  </div>

  <div id="worldsContainer"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
  import {
    getFirestore, doc, getDoc, collection, query, where, getDocs
  } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

  /* ============================================================
     Firebase config — same object duplicated in login.html, hub.html
     and every modules/*.html file (each screen is a self-contained
     page with no shared JS import). The API key is a public client
     identifier; access is controlled by Firestore security rules.
     ============================================================ */
  const firebaseConfig = {
    apiKey: "AIzaSyBtlViRgm26PuMPvNC9GoKA9hBwtYT-HEg",
    authDomain: "english-dbcda.firebaseapp.com",
    projectId: "english-dbcda",
    storageBucket: "english-dbcda.firebasestorage.app",
    messagingSenderId: "174382751098",
    appId: "1:174382751098:web:7736264ea3153970cd8ac3"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Active-session pointer only — the actual student record lives in Firestore.
  const STUDENT_ID_KEY = "eduverse_student_id";

  async function getActiveStudent(){
    const id = localStorage.getItem(STUDENT_ID_KEY);
    if (!id) return null;
    const snap = await getDoc(doc(db, "students", id));
    if (!snap.exists()) return null;
    return { studentId: snap.id, ...snap.data() };
  }

  async function loadProgressMap(studentId){
    const q = query(collection(db, "progress"), where("studentId", "==", studentId));
    const snap = await getDocs(q);
    const map = {};
    snap.forEach(d => { map[d.data().moduleId] = d.data(); });
    return map;
  }

  /* ============================================================
     Module manifest — kept identical to hub.html's (each page is
     self-contained, no shared import).
     ============================================================ */
  const MODULES = [
    { id:"y1_sfaf_listening_bunyi_padan", num:1, world:"self_family_friends", skill:"listening", year:1, title:{bm:"Bunyi & Padan", en:"Sound & Match"}, path:"modules/module-01-bunyi-padan.html" },
    { id:"y1_sfaf_speaking_sapa_balas", num:2, world:"self_family_friends", skill:"speaking", year:1, title:{bm:"Sapa & Balas", en:"Greet & Reply"}, path:"modules/module-02-sapa-balas.html" },
    { id:"y1_sfaf_writing_jejak_huruf", num:3, world:"self_family_friends", skill:"writing", year:1, title:{bm:"Jejak Huruf", en:"Letter Trace"}, path:"modules/module-03-jejak-huruf.html" },
    { id:"y1_sfaf_reading_padan_label", num:4, world:"self_family_friends", skill:"reading", year:1, title:{bm:"Padan Label", en:"Match the Label"}, path:"modules/module-04-padan-label.html" },
    { id:"y1_sfaf_writing_bina_ayat_mini", num:5, world:"self_family_friends", skill:"writing", year:1, title:{bm:"Bina Ayat Mini", en:"Build a Mini Sentence"}, path:"modules/module-05-bina-ayat-mini.html" },
    { id:"y1_stories_listening_ikut_arahan", num:6, world:"stories", skill:"listening", year:1, title:{bm:"Ikut Arahan", en:"Follow the Instruction"}, path:"modules/module-06-ikut-arahan.html" },
    { id:"y1_stories_languagearts_puisi_lagu", num:7, world:"stories", skill:"language_arts", year:1, title:{bm:"Zon Puisi & Lagu", en:"Poem & Song Zone"}, path:"modules/module-07-puisi-lagu.html", noGate:true },
    { id:"y2_stories_languagearts_bina_ceritaku", num:8, world:"stories", skill:"language_arts", year:2, title:{bm:"Bina Ceritaku", en:"Build My Story"}, path:"modules/module-08-bina-ceritaku.html" },
    { id:"y1_stories_reading_susun_baca", num:9, world:"stories", skill:"reading", year:1, title:{bm:"Susun & Baca", en:"Blend & Read"}, path:"modules/module-09-susun-baca.html" },
    { id:"y2_stories_reading_cari_dalam_dunia", num:10, world:"stories", skill:"reading", year:2, title:{bm:"Cari dalam Dunia", en:"Find It in the World"}, path:"modules/module-10-cari-dalam-dunia.html" },
    { id:"y1_knowledge_languagearts_kedai_mini", num:11, world:"knowledge", skill:"language_arts", year:1, title:{bm:"Kedai Mini", en:"Mini Shop"}, path:"modules/module-11-kedai-mini.html" },
    { id:"y1_knowledge_languagearts_puzzle_alam_sekitar", num:12, world:"knowledge", skill:"language_arts", year:1, title:{bm:"Puzzle Alam Sekitar", en:"Environment Puzzle"}, path:"modules/module-12-puzzle-alam-sekitar.html" },
    { id:"y1_knowledge_speaking_suka_tak_suka", num:13, world:"knowledge", skill:"speaking", year:1, title:{bm:"Suka/Tak Suka", en:"Like/Don't Like"}, path:"modules/module-13-suka-tak-suka.html" },
    { id:"y2_knowledge_speaking_nama_huraikan", num:14, world:"knowledge", skill:"speaking", year:2, title:{bm:"Nama & Huraikan", en:"Name & Describe"}, path:"modules/module-14-nama-huraikan.html" },
    { id:"y2_knowledge_listening_dengar_perincian", num:15, world:"knowledge", skill:"listening", year:2, title:{bm:"Dengar & Perincian", en:"Listen for Detail"}, path:"modules/module-15-dengar-perincian.html" },
    { id:"y2_knowledge_reading_faham_perincian", num:16, world:"knowledge", skill:"reading", year:2, title:{bm:"Faham Perincian", en:"Understand the Detail"}, path:"modules/module-16-faham-perincian.html" },
    { id:"y2_knowledge_writing_bina_ayat_kreatif", num:17, world:"knowledge", skill:"writing", year:2, title:{bm:"Bina Ayat Kreatif", en:"Build a Creative Sentence"}, path:"modules/module-17-bina-ayat-kreatif.html" },
    { id:"y2_knowledge_listening_bunyi_padan_lanjutan", num:18, world:"knowledge", skill:"listening", year:2, title:{bm:"Bunyi & Padan Lanjutan", en:"Sound & Match: Blends"}, path:"modules/module-18-bunyi-padan-lanjutan.html" }
  ];

  const WORLDS = [
    { key:"self_family_friends", emoji:"🏡", bm:"Dunia Diri, Keluarga & Kawan", en:"World of Self, Family and Friends" },
    { key:"stories", emoji:"📚", bm:"Dunia Cerita", en:"World of Stories" },
    { key:"knowledge", emoji:"🌍", bm:"Dunia Pengetahuan", en:"World of Knowledge" }
  ];

  const SKILL_EMOJI = { listening:"🎧", speaking:"🗣️", reading:"📖", writing:"✍️", language_arts:"🎨" };

  /* PL (1-6) → stars, identical mapping to every module's own
     renderResults() — PL itself is never shown, only this
     translation (CLAUDE.md constraint 4). */
  function starsForPL(pl){
    if (pl >= 5) return 3;
    if (pl >= 3) return 2;
    return 1;
  }
  function starString(stars){ return "⭐".repeat(stars) + "☆".repeat(3 - stars); }

  function moduleRow(mod, progressMap){
    const progress = progressMap[mod.id];
    const row = document.createElement("div");
    row.className = "module-row";

    let statusHtml;
    if (mod.noGate) {
      statusHtml = progress
        ? `<div class="status-text explored">✓ Explored</div>`
        : `<div class="status-text">Not tried yet</div>`;
    } else if (!progress) {
      statusHtml = `<div class="status-text">Not played yet</div>`;
    } else {
      const stars = starsForPL(progress.performanceLevel);
      statusHtml = `<div class="stars-row">${starString(stars)}</div>` +
        (progress.masteryAchieved ? `<div class="status-text mastered">Mastered</div>` : `<div class="status-text">Tried</div>`);
    }

    row.innerHTML = `
      <div class="module-row-emoji">${SKILL_EMOJI[mod.skill] || "🎮"}</div>
      <div class="module-row-titles">
        <div class="module-row-title-primary">${mod.title.en}</div>
        <div class="module-row-title-secondary">${mod.title.bm}</div>
      </div>
      <div class="module-row-status">${statusHtml}</div>`;
    row.addEventListener("click", () => { window.location.href = mod.path; });
    row.style.cursor = "pointer";
    return row;
  }

  async function main(){
    const student = await getActiveStudent();
    if (!student) { window.location.href = "login.html"; return; }

    document.getElementById("yearText").textContent = student.name + " — Year " + student.year;

    const progressMap = await loadProgressMap(student.studentId);
    const yearModules = MODULES.filter(m => m.year === student.year);
    const gatedModules = yearModules.filter(m => !m.noGate);

    let masteredCount = 0, triedCount = 0, totalStars = 0;
    gatedModules.forEach(mod => {
      const progress = progressMap[mod.id];
      if (!progress) return;
      triedCount++;
      if (progress.masteryAchieved) masteredCount++;
      totalStars += starsForPL(progress.performanceLevel);
    });

    document.getElementById("statMastered").textContent = masteredCount + "/" + gatedModules.length;
    document.getElementById("statStars").textContent = totalStars + " / " + (gatedModules.length * 3) + " ⭐";
    document.getElementById("statTried").textContent = String(triedCount);

    const container = document.getElementById("worldsContainer");
    WORLDS.forEach(world => {
      const modules = yearModules.filter(m => m.world === world.key);
      if (modules.length === 0) return;

      const section = document.createElement("div");
      section.className = "world-section";

      const header = document.createElement("div");
      header.className = "world-header";
      header.innerHTML = `
        <div class="world-emoji">${world.emoji}</div>
        <div>
          <p class="world-title-primary">${world.en}</p>
          <p class="world-title-secondary">${world.bm}</p>
        </div>`;
      section.appendChild(header);

      modules.forEach(mod => section.appendChild(moduleRow(mod, progressMap)));
      container.appendChild(section);
    });

    if (yearModules.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-note";
      empty.textContent = "No modules found for Year " + student.year + ".";
      container.appendChild(empty);
    }

    document.getElementById("backBtn").addEventListener("click", () => {
      window.location.href = "hub.html";
    });
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem(STUDENT_ID_KEY);
      window.location.href = "login.html";
    });
  }

  await main();
</script>
</body>
</html>
